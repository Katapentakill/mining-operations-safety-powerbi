name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # CI never downloads MSHA data: it loads the small committed fixtures instead.
      CSV_DIR: ./tests/fixtures/csv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env with throwaway passwords
        run: |
          printf 'MSSQL_SA_PASSWORD=Ci%sAa1\nPBI_READER_PASSWORD=Rd%sBb2\nMSSQL_PORT=1433\n' "$(openssl rand -hex 8)" "$(openssl rand -hex 8)" > .env

      - name: Unit tests
        run: python -m pytest tests/unit

      - name: Start SQL Server, create objects and load fixtures
        run: python scripts/04_load_sqlserver.py --slug fixture

      - name: SQL assertions
        run: python -m pytest tests/sql

      - name: Validate Power BI project files
        run: python scripts/validate_pbip.py

      - name: SQL Server logs (on failure)
        if: failure()
        run: docker compose logs --tail 100 sqlserver
