name: mining-ops-safety

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mining-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?copy .env.example to .env and set the passwords}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      # Local only: the database is never exposed to the network.
      - "127.0.0.1:${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
      - ./data/load:/data/load:ro   # UTF-16 copies of the CSV files, written by scripts/04_load_sqlserver.py
      - ./sql:/sql:ro
      - ./tests/sql:/tests:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -h -1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  mssql-data:
